version: '3.8'

services:
  # 1. MongoDB - Operational Records & Asset Documents
  mongodb:
    image: mongo:7.0
    container_name: intelgraph-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Neo4j - Industrial Knowledge Graph
  neo4j:
    image: neo4j:5.18.0
    container_name: intelgraph-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # HTTP UI
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/intelgraph2026
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p intelgraph2026 'RETURN 1;'"]
      interval: 10s
      timeout: 10s
      retries: 5

  # 3. Qdrant - Industrial Vector Engine
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: intelgraph-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. IntelGraph Backend - FastAPI, AI Orchestrator, GraphRAG, Connectors
  backend:
    build:
      context: ./intelgraph-backend
      dockerfile: Dockerfile
    container_name: intelgraph-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=intelgraph_ai
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=intelgraph2026
      - QDRANT_URL=http://qdrant:6333
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ENVIRONMENT=production
    depends_on:
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  # 5. IntelGraph Frontend - Vite React Enterprise Workspace
  frontend:
    build:
      context: ./intelgraph-frontend
      dockerfile: Dockerfile
    container_name: intelgraph-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  mongo_data:
  neo4j_data:
  qdrant_data:
